apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: orderflow-default-deny
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/part-of: orderflow
  policyTypes:
    - Ingress
    - Egress
  ingress: []
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
