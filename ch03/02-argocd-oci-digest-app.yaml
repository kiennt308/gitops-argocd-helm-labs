apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: order-service-oci-prod
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: orderflow-apps
  sources:
    - repoURL: ghcr.io/kiennt308/charts
      chart: orderflow-service
      targetRevision: >-
        1.4.0@sha256:9f86d081884c7d659a2feaa0c55ad015a3bf4f1b2b0b822cd15d6c15b0f00a08
      helm:
        releaseName: order-service
        valueFiles:
          - $values/code-labs/ch02/values-order-service.yaml
    - repoURL: https://github.com/kiennt308/gitops-argocd-helm-labs.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: orderflow-prod
  syncPolicy:
    syncOptions:
      - ServerSideApply=true
      - RespectIgnoreDifferences=true
