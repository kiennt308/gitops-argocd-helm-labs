apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: order-service-db-credentials
  namespace: orderflow-prod
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager-prod
    kind: ClusterSecretStore
  target:
    name: order-service-db-credentials
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: DB_USERNAME
      remoteRef:
        key: orderflow/prod/order-service
        property: username
    - secretKey: DB_PASSWORD
      remoteRef:
        key: orderflow/prod/order-service
        property: password
    - secretKey: REDIS_AUTH_TOKEN
      remoteRef:
        key: orderflow/prod/order-service
        property: redis_token
