# Install controller from migrated repo (NOT deprecated bitnami-labs):
# helm repo add sealed-secrets https://bitnami.github.io/sealed-secrets
# helm upgrade --install sealed-secrets sealed-secrets/sealed-secrets \
#   --namespace kube-system --version 2.18.0
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: payment-worker-webhook-key
  namespace: orderflow-prod
  annotations:
    sealedsecrets.bitnami.com/cluster-wide: "false"
spec:
  encryptedData:
    WEBHOOK_HMAC_KEY: >-
      AgBy3i4OJSWK+PiTySYX9r0M5exampleCiphertextOnlyNotRealKeyPayload==
  template:
    metadata:
      name: payment-worker-webhook-key
      namespace: orderflow-prod
      labels:
        app.kubernetes.io/part-of: orderflow
    type: Opaque
