apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: aws-secrets-manager-prod
spec:
  provider:
    aws:
      service: SecretsManager
      region: us-east-1
      # Uses the external-secrets controller ServiceAccount credential
      # chain provisioned via EKS Pod Identity (Book 02, Chapter 6).
  conditions:
    - namespaces:
        - orderflow-staging
        - orderflow-prod
