apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: orderflow-hpa-aware-prod
  namespace: argocd
spec:
  project: orderflow-apps
  source:
    repoURL: https://github.com/kiennt308/gitops-argocd-helm-labs.git
    targetRevision: v1.4.0
    path: code-labs/charts/orderflow-service
    helm:
      releaseName: order-service
      valueFiles:
        - ../../ch02/values-order-service.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: orderflow-prod
  ignoreDifferences:
    - group: apps
      kind: Deployment
      jqPathExpressions:
        - .spec.replicas
    - group: admissionregistration.k8s.io
      kind: ValidatingWebhookConfiguration
      jqPathExpressions:
        - .webhooks[].clientConfig.caBundle
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
      - RespectIgnoreDifferences=true
