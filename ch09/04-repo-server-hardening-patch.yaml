apiVersion: v1
kind: ConfigMap
metadata:
  name: argocd-repo-server-limits
  namespace: argocd
  labels:
    app.kubernetes.io/name: argocd-cmd-params-cm
    app.kubernetes.io/part-of: argocd
data:
  reposerver.helm.manifest.max.extracted.size: "10M"
  reposerver.helm.registry.max.index.size: "50M"
  reposerver.parallelism.limit: "10"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: argocd-repo-server
  namespace: argocd
  labels:
    app.kubernetes.io/name: argocd-repo-server
    app.kubernetes.io/part-of: argocd
    app.kubernetes.io/component: repo-server
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: argocd-repo-server
  template:
    metadata:
      labels:
        app.kubernetes.io/name: argocd-repo-server
        app.kubernetes.io/part-of: argocd
    spec:
      serviceAccountName: argocd-repo-server
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: argocd-repo-server
          image: quay.io/argoproj/argocd:v3.6.2
          args:
            - /usr/local/bin/argocd-repo-server
            - --max-combined-directory-manifests-size=10M
            - --helm-manifest-max-extracted-size=10M
            - --helm-registry-max-index-size=50M
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 1Gi
          volumeMounts:
            - name: helm-working-dir
              mountPath: /helm-working-dir
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: helm-working-dir
          emptyDir:
            sizeLimit: 256Mi
        - name: tmp
          emptyDir:
            sizeLimit: 256Mi
