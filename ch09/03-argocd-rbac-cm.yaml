apiVersion: v1
kind: ConfigMap
metadata:
  name: argocd-rbac-cm
  namespace: argocd
  labels:
    app.kubernetes.io/name: argocd-rbac-cm
    app.kubernetes.io/part-of: argocd
data:
  policy.default: ""
  scopes: "[groups, email]"
  policy.csv: |
    g, platform-admins, role:admin
    p, role:sre-auditor, applications, get, */*, allow
    p, role:sre-auditor, applications, action/*, */*, deny
    p, role:sre-auditor, clusters, get, *, allow
    p, role:sre-auditor, projects, get, *, allow
    p, role:sre-auditor, logs, get, */*, allow
    g, sre-auditors, role:sre-auditor
    p, role:staging-deployer, applications, get, orderflow-apps/*, allow
    p, role:staging-deployer, applications, sync, orderflow-apps/staging-*, allow
    g, orderflow-developers, role:staging-deployer
