apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: cilium
spec:
  controllerName: io.cilium/gateway-controller
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: orderflow-gateway
  namespace: orderflow-prod
spec:
  gatewayClassName: cilium
  listeners:
    - name: http
      protocol: HTTP
      port: 8080
      allowedRoutes:
        namespaces:
          from: Same
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: order-service-route
  namespace: orderflow-prod
spec:
  parentRefs:
    - name: orderflow-gateway
      namespace: orderflow-prod
      sectionName: http
  hostnames:
    - api.orderflow.example.com
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /api/v1/orders
      backendRefs:
        - name: order-service-stable
          port: 8080
          weight: 100
        - name: order-service-canary
          port: 8080
          weight: 0
