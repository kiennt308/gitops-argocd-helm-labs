apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: orderflow-staging-api
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: orderflow-apps
  source:
    repoURL: https://github.com/kiennt308/gitops-argocd-helm-labs.git
    targetRevision: main
    path: code-labs/charts/orderflow-service
    helm:
      releaseName: order-service
      valueFiles:
        - ../../ch02/values-order-service.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: orderflow-staging
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - RespectIgnoreDifferences=true
    retry:
      limit: 3
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 1m
