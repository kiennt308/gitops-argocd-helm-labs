apiVersion: v1
kind: Secret
metadata:
  name: cluster-orderflow-staging-us-east-1
  namespace: argocd
  labels:
    argocd.argoproj.io/secret-type: cluster
    env: staging
    region: us-east-1
    orderflow-tier: app
stringData:
  name: orderflow-staging-us-east-1
  server: https://staging-eks.us-east-1.orderflow.internal
  config: |
    {
      "awsAuthConfig": {
        "clusterName": "orderflow-staging-us-east-1",
        "roleARN": "arn:aws:iam::111122223333:role/orderflow-argocd-spokes"
      },
      "tlsClientConfig": {
        "insecure": false,
        "caData": "LS0tLS1CRUdJTiBDRVJUSUZJQ0FURS0tLS0tCg=="
      }
    }
